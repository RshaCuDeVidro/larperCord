name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      # Os testes cobrem as partes puras (KDL, cores, layout, markdown, Store,
      # temas embutidos, protobuf, APNG, URLs de mídia) e não precisam de SDL.
      - run: zig build test
      # O gerador de plugin do site contra a API do app: cabeçalho, capacidades, luac e
      # cada plugin gerado rodando num larper de mentira com as regras do app.
      - name: Gerador de plugin do site
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends lua5.4
          node tools/test_plugin_starter.js
      # O mínimo comum, como na release: o supressor de ruído escolhe o caminho ao rodar.
      - name: Caminhos do supressor de ruído
        run: |
          zig build test -Dcpu=baseline
          for arch in 0 1 2; do LARPER_RNNOISE_ARCH=$arch zig build ruido-custo -Dcpu=baseline; done

  # O build para Windows sai do Linux (as bibliotecas vêm de tools/windows_deps.sh).
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: tools/windows_deps.sh
      - run: zig build -Dtarget=x86_64-windows-gnu -Dqa=true
      - uses: actions/upload-artifact@v4
        with:
          name: windows-qa-build
          path: zig-out/bin/

  # O QA completo num Windows de verdade (sem GPU, então com folga no tempo).
  windows-qa:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-qa-build
          path: bin
      - name: QA
        shell: pwsh
        env:
          SDL_VIDEO_DRIVER: windows
          LARPER_RENDERER: software
          QA_SLOW: "3"
        run: |
          New-Item -ItemType Directory -Force qa-out | Out-Null
          $p = Start-Process -FilePath bin\larpercord.exe -ArgumentList '--qa','--theme','classico' -NoNewWindow -Wait -PassThru -RedirectStandardOutput qa-out\out.txt -RedirectStandardError qa-out\err.txt
          Get-Content qa-out\out.txt,qa-out\err.txt -ErrorAction SilentlyContinue | Select-String -Pattern 'passaram|falharam|^\s+- \[|panic' | ForEach-Object { $_.Line }
          exit $p.ExitCode
      - name: FFmpeg button, real download
        shell: pwsh
        env:
          SDL_VIDEO_DRIVER: windows
          LARPER_RENDERER: software
          QA_SUITE: ffmpeg
        run: |
          $p = Start-Process -FilePath bin\larpercord.exe -ArgumentList '--qa','--theme','classico' -NoNewWindow -Wait -PassThru -RedirectStandardOutput qa-out\ffmpeg-out.txt -RedirectStandardError qa-out\ffmpeg-err.txt
          Get-Content qa-out\ffmpeg-out.txt,qa-out\ffmpeg-err.txt -ErrorAction SilentlyContinue | Select-String -Pattern 'passaram|falharam|^\s+- \[|panic' | ForEach-Object { $_.Line }
          exit $p.ExitCode
      # "Apagar todos os dados" com as pastas de mentira em qa-out\apagar (como tools/qa_apagar.sh):
      # um arquivo só leitura, uma junção para fora (sai a junção, nunca o que ela aponta) e
      # outro programa ao lado. O Gerenciador de Credenciais de verdade nunca é tocado no QA.
      - name: Delete all data
        shell: pwsh
        env:
          SDL_VIDEO_DRIVER: windows
          LARPER_RENDERER: software
          QA_SUITE: apagar
        run: |
          $r = Join-Path $PWD 'qa-out\apagar'
          $cfg = Join-Path $r 'config\larpercord'
          $cache = Join-Path $r 'cache\larpercord'
          New-Item -ItemType Directory -Force "$cfg\tokens","$cfg\themes","$cache\messages\1","$cache\ffmpeg","$r\fora","$r\config\outro-app" | Out-Null
          Set-Content "$cfg\settings.kdl" 'settings theme="classico"'
          Set-Content "$cfg\tokens\123" 'token-de-mentira'
          Set-Content "$cache\messages\1\2.bin" 'cache'
          Set-Content "$cache\debug.log" 'registro'
          Set-Content "$cache\ffmpeg\avcodec-61.dll" 'dll'
          Set-ItemProperty "$cache\ffmpeg\avcodec-61.dll" -Name IsReadOnly -Value $true
          Set-Content "$r\fora\importante.txt" 'fica'
          New-Item -ItemType Junction -Path "$cfg\themes\link" -Target "$r\fora" | Out-Null
          Set-Content "$r\config\outro-app\keep.txt" 'fica'
          $env:QA_APAGAR_RAIZ = $r
          $env:XDG_CONFIG_HOME = Join-Path $r 'config'
          $env:XDG_CACHE_HOME = Join-Path $r 'cache'
          $p = Start-Process -FilePath bin\larpercord.exe -ArgumentList '--qa','--theme','classico' -NoNewWindow -Wait -PassThru -RedirectStandardOutput qa-out\apagar-out.txt -RedirectStandardError qa-out\apagar-err.txt
          Get-Content qa-out\apagar-out.txt,qa-out\apagar-err.txt -ErrorAction SilentlyContinue | Select-String -Pattern 'passaram|falharam|^\s+- \[|panic|apagar:' | ForEach-Object { $_.Line }
          $bad = 0
          if ($p.ExitCode -ne 0) { "saiu com o código $($p.ExitCode)"; $bad = 1 }
          if (Test-Path $cfg) { "sobrou $cfg"; Get-ChildItem -Recurse -Force $cfg | ForEach-Object { $_.FullName }; $bad = 1 }
          if (Test-Path $cache) { "sobrou $cache"; Get-ChildItem -Recurse -Force $cache | ForEach-Object { $_.FullName }; $bad = 1 }
          if (-not (Test-Path "$r\fora\importante.txt")) { "apagou o que a junção apontava"; $bad = 1 }
          if (-not (Test-Path "$r\config\outro-app\keep.txt")) { "apagou a pasta de outro programa"; $bad = 1 }
          if ($bad -eq 0) { "apagar: tudo passou" }
          exit $bad
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-qa-out
          path: qa-out/

  # O app inteiro (UI, rede, imagens) só compila com as bibliotecas do
  # sistema: roda num Arch, que tem SDL3, libwebp e companhia nos pacotes.
  # Depois, o QA completo fora da tela, com os dados de demonstração.
  build-and-qa:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed git pkgconf sdl3 curl zlib freetype2 fontconfig libwebp opus noto-fonts noto-fonts-emoji python weston xorg-server-xvfb
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig build
      - name: Wayland nativo, escala e fallback X11
        run: python3 tools/qa_wayland.py zig-out/bin/larpercord
      - run: ./tools/qa.sh
        env:
          SDL_VIDEO_DRIVER: offscreen
          QA_SLOW: "3"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-qa-out
          path: qa-out/
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-out
          path: qa-out/

  # O site: cada tema de themes/community/ com as regras do app e da galeria (metadados,
  # nome único, sem cópia de tema embutido) e o teste do criador de temas, que carrega cada
  # um como o app. Um tema quebrado num pull request falha aqui, antes de chegar ao Pages.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python3 tools/gen_site.py --check-community
      - run: node tools/theme_builder_test.js
